[package]
name = "fms-wasm"
description = "WASM bindings for Fit Meter Sync"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
fms-samu = { workspace = true }
futures = "0.3.34"
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = [
    "Navigator", "ReadableStream", "ReadableStreamDefaultReader", "Serial", "SerialOptions", "SerialPort", "WritableStream", "WritableStreamDefaultWriter", "Window"
] }

console_error_panic_hook = { version = "0.1.1", optional = true }
wasm-streams = "0.6.0"


[package.metadata.wasm-pack.profile.release]
wasm-opt = false
